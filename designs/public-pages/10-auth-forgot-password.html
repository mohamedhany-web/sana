<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <title>نسيت كلمة المرور؟ — Sana</title>
  <meta name="theme-color" content="#1D4EDB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/sana-auth-geo.css">
  <style>
    .design-mirror-badge {
      position: fixed; z-index: 99999; bottom: 12px; inset-inline-start: 12px;
      background: #1e1b4b; color: #fff; font: 700 .72rem/1 Tajawal,sans-serif;
      padding: .45rem .7rem; border-radius: 999px; opacity: .85; pointer-events: none;
    }
  </style>
</head>
<body class="geo-page">
  <div class="design-mirror-badge">مرآة تصميم الإنتاج · auth/forgot-password.blade.php</div>
  <canvas id="geo-canvas" aria-hidden="true"></canvas>

  <div class="geo-layer">
    <nav class="geo-nav">
      <a href="01-home.html" class="geo-logo geo-logo--brand"><span>SANA</span></a>
      <a href="06-auth-login.html" class="geo-nav-link">تسجيل الدخول</a>
    </nav>

    <main class="geo-stage">
      <div class="geo-panel geo-login-panel">
        <div class="geo-brand-mark">
          <span class="geo-logo" style="font-size:1.4rem">SANA</span>
        </div>

        <h1 class="geo-headline">استعادة<br><em>الوصول</em></h1>
        <p class="geo-lead">أدخل البريد الإلكتروني المسجل في الأكاديمية وسنرسل لك رابطاً لتغيير كلمة المرور.</p>

        <form onsubmit="event.preventDefault();">
          <div class="geo-field-wrap">
            <input type="email" class="geo-field" placeholder="البريد الإلكتروني" dir="ltr">
            <span class="geo-field-line"></span>
          </div>

          <button type="submit" class="geo-cta">
            <span>إرسال رابط إعادة التعيين</span>
            <span>→</span>
          </button>
        </form>

        <p style="margin-top:2rem;font-size:.85rem;color:var(--edu-muted)">
          تذكرت كلمة المرور؟ <a href="06-auth-login.html" class="geo-link">العودة لتسجيل الدخول</a>
        </p>
        <p style="margin-top:.75rem;font-size:.8rem;color:var(--edu-muted)">
          <a href="01-home.html" class="geo-link">العودة للرئيسية</a>
        </p>
      </div>
    </main>
  </div>

</html>
